# The agent service: LangGraph workflow, pgvector retrieval, Claude API.
#
# No "replicas" field on purpose. The HorizontalPodAutoscaler owns the replica count, and a
# fixed number here would make Argo CD selfHeal fight the autoscaler.
apiVersion: v1
kind: Service
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: agent
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: ai-platform
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: agent
          image: ghcr.io/sarvagna23/ai-platform-agent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            # Created by hand with "make secret", never stored in Git.
            # optional: true lets the pod start without it; /run then answers 503 until it exists.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: LLM_MODE
              value: anthropic
            - name: CLAUDE_MODEL
              value: claude-haiku-4-5-20251001
          # Loading the embedding model takes a few seconds, so give startup room.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          # CPU requests matter: the autoscaler measures utilization against them.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
