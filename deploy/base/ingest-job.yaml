# Loads the knowledge base into pgvector after every Argo CD sync.
# PostSync means Argo CD runs it once all other resources are healthy, so Postgres is up.
# The ingest is idempotent (upserts by title), so running it on every sync is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest-knowledge
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest
        app.kubernetes.io/part-of: ai-platform
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ingest
          image: ghcr.io/sarvagna23/ai-platform-agent
          command: ["python", "-m", "app.ingest"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
